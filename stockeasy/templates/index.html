<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockEasy — 한눈에 보는 시황</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ── HEADER ── -->
<header class="header">
  <div class="header-inner">
    <span class="logo">StockEasy</span>
    <div class="header-right">
      <span class="update-time" id="lastUpdated">--:-- 기준</span>
      <div class="refresh-ctrl">
        <span class="refresh-label">자동 갱신</span>
        <select id="intervalSelect" class="interval-select">
          <option value="10">10초</option>
          <option value="30" selected>30초</option>
          <option value="60">1분</option>
          <option value="0">끄기</option>
        </select>
        <button id="manualRefresh" class="btn-refresh" title="지금 갱신">↻</button>
      </div>
    </div>
  </div>
</header>

<!-- ── TOP TICKER BAR ── -->
<div class="ticker-bar" id="tickerBar">
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-loading">시황 데이터 불러오는 중...</span>
  </div>
</div>

<!-- ── MAIN ── -->
<main class="main">

  <!-- 국내 지수 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">국내 지수</h2>
      <span class="market-badge" id="domesticBadge">—</span>
    </div>
    <div class="card-grid" id="domesticGrid">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>
  </section>

  <!-- 미국 선물 + 원자재 -->
  <div class="two-col">

    <section class="section">
      <div class="section-header">
        <h2 class="section-title">미국 선물</h2>
        <span class="market-badge" id="usBadge">—</span>
      </div>
      <div class="card-grid card-grid--col1" id="usGrid">
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2 class="section-title">원자재</h2>
      </div>
      <div class="card-grid card-grid--col1" id="commodityGrid">
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
        <div class="card skeleton"></div>
      </div>
    </section>

  </div>

  <!-- 실시간 속보 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">실시간 속보</h2>
      <span class="news-count" id="newsCount"></span>
    </div>
    <ul class="news-list" id="newsList">
      <li class="news-item news-loading">뉴스 불러오는 중...</li>
    </ul>
  </section>

</main>

<footer class="footer">
  <p>데이터 출처: Yahoo Finance · 주요 언론사 RSS · 시세는 실시간과 약간의 지연이 있을 수 있습니다.</p>
</footer>

<script src="/static/js/main.js"></script>
</body>
</html>
