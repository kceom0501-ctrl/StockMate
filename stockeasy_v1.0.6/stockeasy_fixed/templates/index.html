<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockEasy — 한눈에 보는 시황</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <span class="logo">StockEasy</span>
    <div class="header-right">
      <span class="update-time" id="lastUpdated">--:-- 기준</span>
      <div class="refresh-ctrl">
        <span class="refresh-label">자동갱신</span>
        <select id="intervalSelect" class="interval-select">
          <option value="3">실시간</option>
          <option value="10">10초</option>
          <option value="30" selected>30초</option>
          <option value="60">1분</option>
          <option value="0">끄기</option>
        </select>
        <button id="manualRefresh" class="btn-refresh" title="지금 갱신">↻</button>
      </div>
    </div>
  </div>
</header>

<!-- TICKER BAR -->
<div class="ticker-bar">
  <div class="ticker-track" id="tickerTrack">
    <span class="ticker-loading">시황 데이터 불러오는 중...</span>
  </div>
</div>

<!-- MAIN -->
<main class="main">

  <!-- 국내 지수 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">국내 지수</h2>
      <span class="market-badge" id="domesticBadge">—</span>
    </div>
    <div class="card-grid" id="domesticGrid">
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
      <div class="card skeleton"></div>
    </div>
  </section>

  <!-- 미국 선물 + 원자재 -->
  <div class="two-col">
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">미국 선물</h2>
        <span class="market-badge" id="usBadge">—</span>
      </div>
      <div class="card-grid card-grid--col1" id="usGrid">
        <div class="card skeleton" style="height:64px"></div>
        <div class="card skeleton" style="height:64px"></div>
        <div class="card skeleton" style="height:64px"></div>
      </div>
    </section>
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">원자재</h2>
      </div>
      <div class="card-grid card-grid--col1" id="commodityGrid">
        <div class="card skeleton" style="height:64px"></div>
        <div class="card skeleton" style="height:64px"></div>
        <div class="card skeleton" style="height:64px"></div>
      </div>
    </section>
  </div>

  <!-- 거래대금/상승률 상위 종목 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">국내 종목 현황</h2>
      <span class="update-badge" id="stocksUpdated"></span>
    </div>
    <div class="stocks-tabs">
      <button class="tab-btn active" data-tab="volume">거래대금 상위</button>
      <button class="tab-btn" data-tab="gainers">상승률 상위</button>
    </div>
    <div class="stocks-panel" id="stocksPanel">
      <div class="stocks-table-wrap">
        <table class="stocks-table" id="stocksTable">
          <thead>
            <tr>
              <th>순위</th><th>종목명</th><th>현재가</th><th id="thCol4">전일종가</th><th id="thCol5">거래대금</th>
            </tr>
          </thead>
          <tbody id="stocksTbody">
            <tr><td colspan="5" class="loading-td">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 실시간 속보 -->
  <section class="section">
    <div class="section-header">
      <h2 class="section-title">실시간 속보</h2>
      <span class="news-count" id="newsCount"></span>
    </div>
    <ul class="news-list" id="newsList">
      <li class="news-item news-loading">뉴스 불러오는 중...</li>
    </ul>
  </section>

</main>

<footer class="footer">
  <p>데이터 출처: Yahoo Finance · 네이버 금융 · 주요 언론사 RSS · 시세는 실시간과 약간의 지연이 있을 수 있습니다.</p>
</footer>

<!-- 차트 모달 -->
<div class="modal-overlay" id="chartModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">—</div>
        <div class="modal-price" id="modalPrice"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="period-btns">
      <button class="period-btn active" data-period="1m">1분</button>
      <button class="period-btn" data-period="3m">3분</button>
      <button class="period-btn" data-period="5m">5분</button>
      <button class="period-btn" data-period="15m">15분</button>
      <button class="period-btn" data-period="30m">30분</button>
      <button class="period-btn" data-period="1d">1일</button>
      <button class="period-btn" data-period="1mo">1달</button>
      <button class="period-btn" data-period="1y">1년</button>
    </div>
    <div class="chart-wrap">
      <canvas id="priceChart"></canvas>
      <div class="chart-loading" id="chartLoading">불러오는 중...</div>
    </div>
  </div>
</div>

<script src="/static/js/main.js"></script>
</body>
</html>
